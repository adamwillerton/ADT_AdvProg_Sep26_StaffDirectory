<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Directory</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            color: #333;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        header h1 { font-size: 1.4rem; font-weight: 600; }

        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }

        /* Toast message */
        .toast {
            padding: 0.75rem 1.25rem;
            border-radius: 6px;
            margin-bottom: 1.25rem;
            font-size: 0.9rem;
            display: none;
        }
        .toast.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; display: block; }
        .toast.error   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; display: block; }

        /* Card */
        .card {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .card h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 1rem;
        }

        /* Form */
        .form-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .form-group { flex: 1; min-width: 160px; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .form-group input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2c3e50;
        }

        /* Buttons */
        .btn {
            padding: 0.5rem 1.1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary   { background: #2c3e50; color: white; }
        .btn-secondary { background: #95a5a6; color: white; }
        .btn-edit      { background: #f39c12; color: white; font-size: 0.8rem; padding: 0.3rem 0.75rem; }
        .btn-delete    { background: #e74c3c; color: white; font-size: 0.8rem; padding: 0.3rem 0.75rem; }

        .form-actions { display: flex; gap: 0.6rem; align-items: center; }

        /* Table */
        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        thead { background: #2c3e50; color: white; }
        th { padding: 0.75rem 1rem; text-align: left; font-weight: 600; font-size: 0.85rem; }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid #eee; vertical-align: middle; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover { background: #f7f9fc; }

        .actions-cell { display: flex; gap: 0.4rem; }

        .staff-count {
            font-size: 0.85rem;
            color: #777;
            font-weight: normal;
        }

        /* Dept badge */
        .badge {
            display: inline-block;
            background: #eaf0fb;
            color: #2c3e50;
            border-radius: 12px;
            padding: 0.2rem 0.65rem;
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #aaa;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<header>
    <span style="font-size:1.5rem;">👥</span>
    <h1>Staff Directory</h1>
</header>

<div class="container">

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Add / Edit Form -->
    <div class="card">
        <h2 id="form-title">Add New Staff Member</h2>
        <form id="staff-form">
            <input type="hidden" id="staff-id">
            <div class="form-row">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="e.g. Jane Smith" required>
                </div>
                <div class="form-group">
                    <label for="role">Role</label>
                    <input type="text" id="role" placeholder="e.g. Software Engineer" required>
                </div>
                <div class="form-group">
                    <label for="department">Department</label>
                    <input type="text" id="department" placeholder="e.g. Technology" required>
                </div>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="submit-btn">Add Staff</button>
                <button type="button" class="btn btn-secondary" id="cancel-btn" style="display:none" onclick="resetForm()">Cancel</button>
            </div>
        </form>
    </div>

    <!-- Staff Table -->
    <div class="card">
        <h2>All Staff &nbsp;<span class="staff-count" id="staff-count"></span></h2>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Role</th>
                        <th>Department</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="staff-tbody"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const API = '/api/staff';

    // ── Fetch & render all staff ──────────────────────────────────────────────
    async function loadStaff() {
        const res = await fetch(API);
        const staff = await res.json();
        const tbody = document.getElementById('staff-tbody');
        const count = document.getElementById('staff-count');

        count.textContent = `(${staff.length} member${staff.length !== 1 ? 's' : ''})`;

        if (staff.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state">No staff members found. Add one above.</div></td></tr>`;
            return;
        }

        tbody.innerHTML = staff.map((s, i) => `
            <tr>
                <td>${i + 1}</td>
                <td><strong>${escape(s.name)}</strong></td>
                <td>${escape(s.role)}</td>
                <td><span class="badge">${escape(s.department)}</span></td>
                <td>
                    <div class="actions-cell">
                        <button class="btn btn-edit"   onclick="startEdit(${s.id}, ${JSON.stringify(s.name)}, ${JSON.stringify(s.role)}, ${JSON.stringify(s.department)})">Edit</button>
                        <button class="btn btn-delete" onclick="deleteStaff(${s.id}, ${JSON.stringify(s.name)})">Delete</button>
                    </div>
                </td>
            </tr>`).join('');
    }

    // ── Submit form (add or update) ───────────────────────────────────────────
    document.getElementById('staff-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('staff-id').value;
        const payload = {
            name:       document.getElementById('name').value.trim(),
            role:       document.getElementById('role').value.trim(),
            department: document.getElementById('department').value.trim()
        };

        const url    = id ? `${API}/${id}` : API;
        const method = id ? 'PUT' : 'POST';

        try {
            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (res.ok) {
                showToast(id ? `${data.name} updated successfully.` : `${data.name} added successfully.`, 'success');
                resetForm();
                loadStaff();
            } else {
                showToast(data.error || 'Something went wrong.', 'error');
            }
        } catch {
            showToast('Could not connect to the server.', 'error');
        }
    });

    // ── Populate form for editing ─────────────────────────────────────────────
    function startEdit(id, name, role, department) {
        document.getElementById('staff-id').value    = id;
        document.getElementById('name').value        = name;
        document.getElementById('role').value        = role;
        document.getElementById('department').value  = department;
        document.getElementById('form-title').textContent        = 'Edit Staff Member';
        document.getElementById('submit-btn').textContent        = 'Save Changes';
        document.getElementById('cancel-btn').style.display      = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ── Delete a staff member ─────────────────────────────────────────────────
    async function deleteStaff(id, name) {
        if (!confirm(`Delete ${name}? This cannot be undone.`)) return;

        try {
            const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
            const data = await res.json();

            if (res.ok) {
                showToast(data.message, 'success');
                loadStaff();
            } else {
                showToast(data.error || 'Delete failed.', 'error');
            }
        } catch {
            showToast('Could not connect to the server.', 'error');
        }
    }

    // ── Reset form to "Add" state ─────────────────────────────────────────────
    function resetForm() {
        document.getElementById('staff-form').reset();
        document.getElementById('staff-id').value               = '';
        document.getElementById('form-title').textContent        = 'Add New Staff Member';
        document.getElementById('submit-btn').textContent        = 'Add Staff';
        document.getElementById('cancel-btn').style.display      = 'none';
    }

    // ── Toast notification ────────────────────────────────────────────────────
    function showToast(msg, type) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = `toast ${type}`;
        setTimeout(() => { el.className = 'toast'; }, 3500);
    }

    // ── Simple HTML escape ────────────────────────────────────────────────────
    function escape(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Initial load ──────────────────────────────────────────────────────────
    loadStaff();
</script>

</body>
</html>
